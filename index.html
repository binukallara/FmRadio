<!DOCTYPE html>
<html lang="ml">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0b0f19">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>മലയാളം റേഡിയോ — Live Player</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manjari:wght@400;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.17/dist/hls.min.js"></script>
<style>
  :root {
    --bg: #0b0f19;
    --bg-elevated: #121826;
    --bg-card: #161e2e;
    --bg-card-hover: #1c263a;
    --border: rgba(255,255,255,0.06);
    --text: #f1f5f9;
    --text-muted: #94a3b8;
    --text-dim: #64748b;
    --accent: #f59e0b;
    --accent-soft: rgba(245,158,11,0.15);
    --accent-glow: rgba(245,158,11,0.35);
    --success: #22c55e;
    --danger: #ef4444;
    --radius: 16px;
    --radius-sm: 10px;
    --player-h: 88px;
    --safe-bottom: env(safe-area-inset-bottom, 0px);
    --font: 'Inter', system-ui, sans-serif;
    --font-ml: 'Manjari', 'Inter', sans-serif;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { height: 100%; }
  body {
    font-family: var(--font);
    background: var(--bg);
    color: var(--text);
    min-height: 100%;
    line-height: 1.45;
    -webkit-font-smoothing: antialiased;
    overflow-x: hidden;
  }

  /* Background ambience */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background:
      radial-gradient(ellipse 80% 50% at 20% -10%, rgba(245,158,11,0.08), transparent 50%),
      radial-gradient(ellipse 60% 40% at 90% 10%, rgba(59,130,246,0.06), transparent 45%),
      radial-gradient(ellipse 50% 30% at 50% 100%, rgba(168,85,247,0.05), transparent 40%);
    pointer-events: none;
    z-index: 0;
  }

  .app {
    position: relative;
    z-index: 1;
    max-width: 1100px;
    margin: 0 auto;
    padding: 0 16px calc(var(--player-h) + 28px + var(--safe-bottom));
    min-height: 100vh;
  }

  /* Header */
  header {
    padding: 28px 0 18px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    flex-wrap: wrap;
  }
  .brand {
    display: flex;
    align-items: center;
    gap: 14px;
  }
  .brand-icon {
    width: 44px;
    height: 44px;
    border-radius: 12px;
    background: linear-gradient(135deg, var(--accent), #ea580c);
    display: grid;
    place-items: center;
    box-shadow: 0 8px 24px var(--accent-glow);
    flex-shrink: 0;
  }
  .brand-icon svg { width: 24px; height: 24px; fill: #fff; }
  .brand h1 {
    font-size: 1.35rem;
    font-weight: 700;
    letter-spacing: -0.02em;
    font-family: var(--font-ml);
  }
  .brand p {
    font-size: 0.8rem;
    color: var(--text-muted);
    margin-top: 2px;
  }
  .header-actions {
    display: flex;
    gap: 8px;
    align-items: center;
  }
  .icon-btn {
    width: 40px;
    height: 40px;
    border-radius: 12px;
    border: 1px solid var(--border);
    background: var(--bg-elevated);
    color: var(--text-muted);
    display: grid;
    place-items: center;
    cursor: pointer;
    transition: all 0.2s;
  }
  .icon-btn:hover, .icon-btn.active {
    color: var(--accent);
    border-color: rgba(245,158,11,0.3);
    background: var(--accent-soft);
  }
  .icon-btn svg { width: 20px; height: 20px; fill: currentColor; }

  /* Search & Filters */
  .toolbar {
    display: flex;
    flex-direction: column;
    gap: 12px;
    margin-bottom: 20px;
  }
  .search-wrap {
    position: relative;
  }
  .search-wrap svg {
    position: absolute;
    left: 14px;
    top: 50%;
    transform: translateY(-50%);
    width: 18px;
    height: 18px;
    fill: var(--text-dim);
    pointer-events: none;
  }
  .search-input {
    width: 100%;
    height: 48px;
    padding: 0 16px 0 44px;
    border-radius: 14px;
    border: 1px solid var(--border);
    background: var(--bg-elevated);
    color: var(--text);
    font-size: 0.95rem;
    font-family: inherit;
    outline: none;
    transition: border-color 0.2s, box-shadow 0.2s;
  }
  .search-input::placeholder { color: var(--text-dim); }
  .search-input:focus {
    border-color: rgba(245,158,11,0.45);
    box-shadow: 0 0 0 3px var(--accent-soft);
  }
  .filters {
    display: flex;
    gap: 8px;
    overflow-x: auto;
    padding-bottom: 4px;
    scrollbar-width: none;
  }
  .filters::-webkit-scrollbar { display: none; }
  .chip {
    flex-shrink: 0;
    height: 36px;
    padding: 0 14px;
    border-radius: 999px;
    border: 1px solid var(--border);
    background: var(--bg-elevated);
    color: var(--text-muted);
    font-size: 0.82rem;
    font-weight: 500;
    cursor: pointer;
    transition: all 0.2s;
    white-space: nowrap;
  }
  .chip:hover { color: var(--text); border-color: rgba(255,255,255,0.12); }
  .chip.active {
    background: var(--accent);
    border-color: var(--accent);
    color: #0b0f19;
    font-weight: 600;
  }

  /* Stats bar */
  .stats {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 14px;
    font-size: 0.8rem;
    color: var(--text-dim);
  }
  .stats strong { color: var(--text-muted); font-weight: 600; }

  /* Station grid */
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
    gap: 12px;
  }
  .station {
    position: relative;
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 14px 14px 14px 16px;
    border-radius: var(--radius);
    background: var(--bg-card);
    border: 1px solid var(--border);
    cursor: pointer;
    transition: all 0.22s ease;
    text-align: left;
    width: 100%;
    color: inherit;
    font-family: inherit;
  }
  .station:hover {
    background: var(--bg-card-hover);
    border-color: rgba(255,255,255,0.1);
    transform: translateY(-1px);
  }
  .station.playing {
    border-color: rgba(245,158,11,0.4);
    background: linear-gradient(135deg, rgba(245,158,11,0.12), var(--bg-card));
    box-shadow: 0 0 0 1px rgba(245,158,11,0.15), 0 12px 32px rgba(0,0,0,0.25);
  }
  .station.offline { opacity: 0.55; }
  .station.offline:hover { opacity: 0.75; }

  .station-avatar {
    width: 48px;
    height: 48px;
    border-radius: 12px;
    background: linear-gradient(145deg, #1e293b, #0f172a);
    display: grid;
    place-items: center;
    font-weight: 700;
    font-size: 1rem;
    color: var(--accent);
    flex-shrink: 0;
    position: relative;
    overflow: hidden;
  }
  .station.playing .station-avatar {
    background: linear-gradient(145deg, var(--accent), #ea580c);
    color: #fff;
  }
  .eq-bars {
    display: none;
    align-items: flex-end;
    gap: 3px;
    height: 18px;
  }
  .station.playing .eq-bars { display: flex; }
  .station.playing .station-avatar .letter { display: none; }
  .eq-bars span {
    width: 3px;
    background: #fff;
    border-radius: 2px;
    animation: eq 0.9s ease-in-out infinite alternate;
  }
  .eq-bars span:nth-child(1) { height: 40%; animation-delay: 0s; }
  .eq-bars span:nth-child(2) { height: 80%; animation-delay: 0.2s; }
  .eq-bars span:nth-child(3) { height: 55%; animation-delay: 0.4s; }
  .eq-bars span:nth-child(4) { height: 90%; animation-delay: 0.1s; }
  @keyframes eq {
    from { transform: scaleY(0.4); }
    to { transform: scaleY(1); }
  }

  .station-info { flex: 1; min-width: 0; }
  .station-name {
    font-weight: 600;
    font-size: 0.95rem;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    font-family: var(--font-ml);
  }
  .station-meta {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-top: 4px;
    font-size: 0.75rem;
    color: var(--text-dim);
  }
  .badge {
    display: inline-flex;
    align-items: center;
    height: 20px;
    padding: 0 8px;
    border-radius: 6px;
    font-size: 0.68rem;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.03em;
  }
  .badge.fm { background: rgba(59,130,246,0.15); color: #60a5fa; }
  .badge.air { background: rgba(34,197,94,0.15); color: #4ade80; }
  .badge.online { background: rgba(168,85,247,0.15); color: #c084fc; }
  .badge.artist { background: rgba(244,63,94,0.15); color: #fb7185; }
  .badge.devotional { background: rgba(245,158,11,0.15); color: #fbbf24; }
  .badge.offline { background: rgba(239,68,68,0.15); color: #f87171; }

  .fav-btn {
    width: 36px;
    height: 36px;
    border-radius: 10px;
    border: none;
    background: transparent;
    color: var(--text-dim);
    display: grid;
    place-items: center;
    cursor: pointer;
    flex-shrink: 0;
    transition: all 0.2s;
  }
  .fav-btn:hover { color: var(--accent); background: var(--accent-soft); }
  .fav-btn.active { color: var(--accent); }
  .fav-btn svg { width: 18px; height: 18px; fill: currentColor; }

  .empty {
    grid-column: 1 / -1;
    text-align: center;
    padding: 60px 20px;
    color: var(--text-dim);
  }
  .empty svg { width: 48px; height: 48px; fill: currentColor; opacity: 0.4; margin-bottom: 12px; }

  /* Mini Player */
  .player {
    position: fixed;
    left: 0;
    right: 0;
    bottom: 0;
    z-index: 100;
    background: rgba(12,16,26,0.92);
    backdrop-filter: blur(20px) saturate(1.4);
    -webkit-backdrop-filter: blur(20px) saturate(1.4);
    border-top: 1px solid var(--border);
    padding: 12px 16px calc(12px + var(--safe-bottom));
    transform: translateY(110%);
    transition: transform 0.35s cubic-bezier(0.22, 1, 0.36, 1);
  }
  .player.visible { transform: translateY(0); }
  .player-inner {
    max-width: 1100px;
    margin: 0 auto;
    display: grid;
    grid-template-columns: 1fr auto;
    gap: 12px 20px;
    align-items: center;
  }
  @media (min-width: 720px) {
    .player-inner {
      grid-template-columns: minmax(180px, 240px) 1fr minmax(140px, 200px);
    }
  }

  .now-playing {
    display: flex;
    align-items: center;
    gap: 12px;
    min-width: 0;
  }
  .np-avatar {
    width: 48px;
    height: 48px;
    border-radius: 12px;
    background: linear-gradient(145deg, var(--accent), #ea580c);
    display: grid;
    place-items: center;
    color: #fff;
    font-weight: 700;
    font-size: 1rem;
    flex-shrink: 0;
    box-shadow: 0 4px 16px var(--accent-glow);
  }
  .np-text { min-width: 0; }
  .np-name {
    font-weight: 600;
    font-size: 0.95rem;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    font-family: var(--font-ml);
  }
  .np-status {
    font-size: 0.75rem;
    color: var(--text-muted);
    display: flex;
    align-items: center;
    gap: 6px;
    margin-top: 2px;
  }
  .live-dot {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: var(--success);
    box-shadow: 0 0 0 0 rgba(34,197,94,0.5);
    animation: pulse 1.6s infinite;
  }
  .live-dot.loading { background: var(--accent); animation: pulse 0.8s infinite; }
  .live-dot.error { background: var(--danger); animation: none; }
  @keyframes pulse {
    0% { box-shadow: 0 0 0 0 rgba(34,197,94,0.45); }
    70% { box-shadow: 0 0 0 8px rgba(34,197,94,0); }
    100% { box-shadow: 0 0 0 0 rgba(34,197,94,0); }
  }

  .controls {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
  }
  .ctrl-btn {
    width: 42px;
    height: 42px;
    border-radius: 12px;
    border: none;
    background: transparent;
    color: var(--text-muted);
    display: grid;
    place-items: center;
    cursor: pointer;
    transition: all 0.2s;
  }
  .ctrl-btn:hover { color: var(--text); background: rgba(255,255,255,0.06); }
  .ctrl-btn svg { width: 22px; height: 22px; fill: currentColor; }
  .ctrl-btn.play {
    width: 52px;
    height: 52px;
    border-radius: 16px;
    background: var(--accent);
    color: #0b0f19;
    box-shadow: 0 6px 20px var(--accent-glow);
  }
  .ctrl-btn.play:hover { background: #fbbf24; transform: scale(1.04); }
  .ctrl-btn.play svg { width: 26px; height: 26px; }
  .ctrl-btn.active { color: var(--accent); }

  .side-controls {
    display: none;
    align-items: center;
    gap: 10px;
    justify-content: flex-end;
  }
  @media (min-width: 720px) {
    .side-controls { display: flex; }
  }
  .vol-wrap {
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .vol-wrap svg { width: 18px; height: 18px; fill: var(--text-dim); flex-shrink: 0; }
  .vol-slider {
    -webkit-appearance: none;
    appearance: none;
    width: 90px;
    height: 4px;
    border-radius: 2px;
    background: rgba(255,255,255,0.12);
    outline: none;
  }
  .vol-slider::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 14px;
    height: 14px;
    border-radius: 50%;
    background: var(--accent);
    cursor: pointer;
    box-shadow: 0 0 0 3px var(--accent-soft);
  }

  /* Sleep menu */
  .sleep-menu {
    position: fixed;
    bottom: calc(var(--player-h) + 16px + var(--safe-bottom));
    left: 50%;
    transform: translateX(-50%);
    width: min(320px, calc(100% - 32px));
    background: var(--bg-elevated);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 16px;
    box-shadow: 0 20px 50px rgba(0,0,0,0.5);
    z-index: 110;
    display: none;
  }
  .sleep-menu.open { display: block; }
  .sleep-menu h3 {
    font-size: 0.9rem;
    margin-bottom: 4px;
  }
  .sleep-menu p {
    font-size: 0.78rem;
    color: var(--text-dim);
    margin-bottom: 12px;
  }
  .sleep-options {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 8px;
  }
  .sleep-opt {
    height: 40px;
    border-radius: 10px;
    border: 1px solid var(--border);
    background: var(--bg-card);
    color: var(--text-muted);
    font-size: 0.85rem;
    font-weight: 500;
    cursor: pointer;
    transition: all 0.2s;
  }
  .sleep-opt:hover, .sleep-opt.active {
    border-color: var(--accent);
    color: var(--accent);
    background: var(--accent-soft);
  }

  /* Toast */
  .toast {
    position: fixed;
    top: 20px;
    left: 50%;
    transform: translateX(-50%) translateY(-120%);
    background: var(--bg-elevated);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 12px 20px;
    border-radius: 12px;
    font-size: 0.88rem;
    z-index: 200;
    box-shadow: 0 12px 40px rgba(0,0,0,0.4);
    transition: transform 0.3s ease;
    max-width: 90%;
    text-align: center;
  }
  .toast.show { transform: translateX(-50%) translateY(0); }

  /* Loading skeleton */
  .skeleton {
    background: linear-gradient(90deg, var(--bg-card) 25%, var(--bg-card-hover) 50%, var(--bg-card) 75%);
    background-size: 200% 100%;
    animation: shimmer 1.2s infinite;
    border-radius: var(--radius);
    height: 76px;
  }
  @keyframes shimmer {
    0% { background-position: 200% 0; }
    100% { background-position: -200% 0; }
  }

  /* Mobile player adjustments */
  @media (max-width: 719px) {
    .player-inner { grid-template-columns: 1fr; }
    .controls { order: -1; }
    .now-playing { justify-content: center; }
    .np-avatar { width: 40px; height: 40px; font-size: 0.9rem; }
  }
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="brand">
      <div class="brand-icon">
        <svg viewBox="0 0 24 24"><path d="M12 3v10.55A4 4 0 1 0 14 17V7h4V3h-6z"/></svg>
      </div>
      <div>
        <h1>മലയാളം റേഡിയോ</h1>
        <p>Live Malayalam Radio Player</p>
      </div>
    </div>
    <div class="header-actions">
      <button class="icon-btn" id="favFilterBtn" title="Favourites only" aria-label="Show favourites">
        <svg viewBox="0 0 24 24"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>
      </button>
      <button class="icon-btn" id="themeBtn" title="Toggle theme" aria-label="Toggle theme" style="display:none">
        <svg viewBox="0 0 24 24"><path d="M12 18a6 6 0 1 0 0-12 6 6 0 0 0 0 12z"/></svg>
      </button>
    </div>
  </header>

  <div class="toolbar">
    <div class="search-wrap">
      <svg viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27A6.471 6.471 0 0 0 16 9.5 6.5 6.5 0 1 0 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
      <input class="search-input" id="search" type="search" placeholder="സ്റ്റേഷൻ തിരയുക... Search stations" autocomplete="off">
    </div>
    <div class="filters" id="filters">
      <button class="chip active" data-cat="all">എല്ലാം</button>
      <button class="chip" data-cat="fm">FM</button>
      <button class="chip" data-cat="air">AIR</button>
      <button class="chip" data-cat="online">Online</button>
      <button class="chip" data-cat="artist">Artist</button>
      <button class="chip" data-cat="devotional">Devotional</button>
      <button class="chip" data-cat="favs">♥ Favourites</button>
    </div>
  </div>

  <div class="stats">
    <span><strong id="countLabel">0</strong> stations</span>
    <span id="playingLabel"></span>
  </div>

  <div class="grid" id="grid"></div>
</div>

<!-- Player bar -->
<div class="player" id="player">
  <div class="player-inner">
    <div class="now-playing">
      <div class="np-avatar" id="npAvatar">R</div>
      <div class="np-text">
        <div class="np-name" id="npName">Select a station</div>
        <div class="np-status">
          <span class="live-dot" id="liveDot" style="display:none"></span>
          <span id="npStatus">Ready</span>
        </div>
      </div>
    </div>

    <div class="controls">
      <button class="ctrl-btn" id="prevBtn" title="Previous" aria-label="Previous station">
        <svg viewBox="0 0 24 24"><path d="M6 6h2v12H6zm3.5 6l8.5 6V6z"/></svg>
      </button>
      <button class="ctrl-btn play" id="playBtn" title="Play / Pause" aria-label="Play or pause">
        <svg id="playIcon" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
      </button>
      <button class="ctrl-btn" id="nextBtn" title="Next" aria-label="Next station">
        <svg viewBox="0 0 24 24"><path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/></svg>
      </button>
      <button class="ctrl-btn" id="favNowBtn" title="Favourite" aria-label="Toggle favourite">
        <svg viewBox="0 0 24 24"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>
      </button>
      <button class="ctrl-btn" id="sleepBtn" title="Sleep timer" aria-label="Sleep timer">
        <svg viewBox="0 0 24 24"><path d="M12.34 2.02C6.59 1.82 2 6.42 2 12c0 5.52 4.48 10 10 10 3.71 0 6.93-2.02 8.66-5.02-7.51-.25-12.09-8.43-8.32-14.96z"/></svg>
      </button>
    </div>

/* ====== AUDIO ENGINE ====== */
function createAudio() {
  if (state.audio) {
    state.audio.pause();
    state.audio.src = '';
    state.audio = null;
  }
  if (state.hls) {
    state.hls.destroy();
    state.hls = null;
  }
  const audio = new Audio();
  audio.crossOrigin = 'anonymous';
  audio.preload = 'none';
  audio.volume = state.volume;
  audio.addEventListener('playing', () => setPlaybackState(true));
  audio.addEventListener('pause', () => {
    if (!state.isLoading) setPlaybackState(false);
  });
  audio.addEventListener('waiting', () => setLoading(true));
  audio.addEventListener('canplay', () => setLoading(false));
  audio.addEventListener('error', () => tryNextStream());
  state.audio = audio;
  return audio;
}

function isHls(url) {
  return /\.m3u8(\?|$)/i.test(url) || url.includes('playlist.m3u8') || url.includes('chunklist.m3u8');
}

function playStation(station, streamIdx = 0) {
  if (!station || !station.streams || !station.streams.length) {
    showToast('No stream available');
    return;
  }
  state.current = station;
  state.streamIndex = streamIdx;
  state.isLoading = true;
  updateNowPlaying();
  playerEl.classList.add('visible');
  addRecent(station.id);

  const url = station.streams[streamIdx];
  const audio = createAudio();

  setLoading(true);
  setStatus('Connecting…');

  if (isHls(url) && window.Hls && Hls.isSupported()) {
    const hls = new Hls({
      enableWorker: true,
      lowLatencyMode: false,
      maxBufferLength: 30
    });
    state.hls = hls;
    hls.loadSource(url);
    hls.attachMedia(audio);
    hls.on(Hls.Events.MANIFEST_PARSED, () => {
      audio.play().catch(onPlayError);
    });
    hls.on(Hls.Events.ERROR, (_, data) => {
      if (data.fatal) tryNextStream();
    });
  } else if (isHls(url) && audio.canPlayType('application/vnd.apple.mpegurl')) {
    // Safari native HLS
    audio.src = url;
    audio.play().catch(onPlayError);
  } else {
    audio.src = url;
    audio.play().catch(onPlayError);
  }

  updateMediaSession(station);
  renderGrid(); // refresh playing indicator
}

function tryNextStream() {
  if (!state.current) return;
  const next = state.streamIndex + 1;
  if (next < state.current.streams.length) {
    setStatus('Trying next stream…');
    playStation(state.current, next);
  } else {
    setLoading(false);
    setPlaybackState(false);
    setStatus('Stream unavailable');
    liveDot.className = 'live-dot error';
    showToast(state.current.name + ' — stream failed');
  }
}

function onPlayError(err) {
  console.warn('Play error', err);
  tryNextStream();
}

function togglePlay() {
  if (!state.current) {
    const first = state.filtered.find(s => !s.offline) || STATIONS.find(s => !s.offline);
    if (first) playStation(first);
    return;
  }
  if (!state.audio) {
    playStation(state.current);
    return;
  }
  if (state.isPlaying) {
    state.audio.pause();
    setPlaybackState(false);
  } else {
    state.audio.play().catch(onPlayError);
  }
}

function setPlaybackState(playing) {
  state.isPlaying = playing;
  state.isLoading = false;
  playIcon.innerHTML = playing
    ? '<path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/>'
    : '<path d="M8 5v14l11-7z"/>';
  if (playing) {
    setStatus('Live');
    liveDot.style.display = '';
    liveDot.className = 'live-dot';
  } else {
    setStatus(state.current ? 'Paused' : 'Ready');
    liveDot.style.display = state.current ? '' : 'none';
    liveDot.className = 'live-dot';
  }
  renderGrid();
}

function setLoading(loading) {
  state.isLoading = loading;
  if (loading) {
    setStatus('Loading…');
    liveDot.style.display = '';
    liveDot.className = 'live-dot loading';
  }
}

function setStatus(text) {
  npStatus.textContent = text;
}

function updateNowPlaying() {
  const s = state.current;
  if (!s) return;
  npName.textContent = s.name;
  npAvatar.textContent = (s.name || '?').charAt(0).toUpperCase();
  favNowBtn.classList.toggle('active', state.favourites.includes(s.id));
}

/* ====== MEDIA SESSION ====== */
function updateMediaSession(station) {
  if (!('mediaSession' in navigator)) return;
  navigator.mediaSession.metadata = new MediaMetadata({
    title: station.name,
    artist: 'Malayalam Radio',
    album: station.category.toUpperCase(),
    artwork: [{ src: '', sizes: '96x96', type: 'image/png' }]
  });
  navigator.mediaSession.setActionHandler('play', () => {
    if (state.audio) state.audio.play();
  });
  navigator.mediaSession.setActionHandler('pause', () => {
    if (state.audio) state.audio.pause();
  });
  navigator.mediaSession.setActionHandler('previoustrack', () => skip(-1));
  navigator.mediaSession.setActionHandler('nexttrack', () => skip(1));
}

/* ====== NAVIGATION ====== */
function skip(dir) {
  if (!state.filtered.length) return;
  let idx = 0;
  if (state.current) {
    const i = state.filtered.findIndex(s => s.id === state.current.id);
    idx = i >= 0 ? i : 0;
  }
  let next = (idx + dir + state.filtered.length) % state.filtered.length;
  // skip offline if possible
  let tries = state.filtered.length;
  while (state.filtered[next].offline && tries--) {
    next = (next + dir + state.filtered.length) % state.filtered.length;
  }
  playStation(state.filtered[next]);
}

/* ====== FAVOURITES & RECENT ====== */
function toggleFav(id, e) {
  if (e) e.stopPropagation();
  const i = state.favourites.indexOf(id);
  if (i >= 0) state.favourites.splice(i, 1);
  else state.favourites.push(id);
  localStorage.setItem('ml-radio-favs', JSON.stringify(state.favourites));
  if (state.current && state.current.id === id) {
    favNowBtn.classList.toggle('active', state.favourites.includes(id));
  }
  renderGrid();
  showToast(i >= 0 ? 'Removed from favourites' : 'Added to favourites');
}

function addRecent(id) {
  state.recent = [id, ...state.recent.filter(x => x !== id)].slice(0, 20);
  localStorage.setItem('ml-radio-recent', JSON.stringify(state.recent));
}

/* ====== SLEEP TIMER ====== */
function setSleep(minutes) {
  clearTimeout(state.sleepTimer);
  state.sleepTimer = null;
  state.sleepEndsAt = null;
  document.querySelectorAll('.sleep-opt').forEach(b => {
    b.classList.toggle('active', Number(b.dataset.min) === minutes && minutes > 0);
  });
  if (minutes <= 0) {
    showToast('Sleep timer off');
    sleepMenu.classList.remove('open');
    return;
  }
  state.sleepEndsAt = Date.now() + minutes * 60 * 1000;
  state.sleepTimer = setTimeout(() => {
    if (state.audio) state.audio.pause();
    setPlaybackState(false);
    setStatus('Sleep timer ended');
    showToast('Good night 🌙');
    state.sleepEndsAt = null;
  }, minutes * 60 * 1000);
  showToast(`Sleep in ${minutes} min`);
  sleepMenu.classList.remove('open');
}

/* ====== FILTER & RENDER ====== */
function getFiltered() {
  let list = STATIONS.slice();
  if (state.category === 'favs' || state.favsOnly) {
    list = list.filter(s => state.favourites.includes(s.id));
  } else if (state.category !== 'all') {
    list = list.filter(s => s.category === state.category);
  }
  if (state.query) {
    const q = state.query.toLowerCase();
    list = list.filter(s =>
      s.name.toLowerCase().includes(q) ||
      s.id.toLowerCase().includes(q) ||
      (s.freq && s.freq.toLowerCase().includes(q))
    );
  }
  // sort: playing first, then non-offline, then name
  list.sort((a, b) => {
    if (state.current) {
      if (a.id === state.current.id) return -1;
      if (b.id === state.current.id) return 1;
    }
    if (a.offline !== b.offline) return a.offline ? 1 : -1;
    return a.name.localeCompare(b.name);
  });
  return list;
}

function renderGrid() {
  state.filtered = getFiltered();
  countLabel.textContent = state.filtered.length;
  playingLabel.textContent = state.current && state.isPlaying
    ? '▶ ' + state.current.name
    : '';

  if (!state.filtered.length) {
    grid.innerHTML = `
      <div class="empty">
        <svg viewBox="0 0 24 24"><path d="M12 3v10.55A4 4 0 1 0 14 17V7h4V3h-6z"/></svg>
        <div>No stations found</div>
      </div>`;
    return;
  }

  grid.innerHTML = state.filtered.map(s => {
    const playing = state.current && state.current.id === s.id && state.isPlaying;
    const isFav = state.favourites.includes(s.id);
    const letter = (s.name || '?').charAt(0).toUpperCase();
    return `
      <button class="station ${playing ? 'playing' : ''} ${s.offline ? 'offline' : ''}"
              data-id="${s.id}" type="button">
        <div class="station-avatar">
          <span class="letter">${letter}</span>
          <div class="eq-bars"><span></span><span></span><span></span><span></span></div>
        </div>
        <div class="station-info">
          <div class="station-name">${escapeHtml(s.name)}</div>
          <div class="station-meta">
            <span class="badge ${s.category}">${s.category}</span>
            ${s.freq ? `<span>${escapeHtml(s.freq)}</span>` : ''}
            ${s.offline ? '<span class="badge offline">offline</span>' : ''}
          </div>
        </div>
        <button class="fav-btn ${isFav ? 'active' : ''}" data-fav="${s.id}" aria-label="Favourite" type="button">
          <svg viewBox="0 0 24 24"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>
        </button>
      </button>`;
  }).join('');
}

function escapeHtml(str) {
  return String(str)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;');
}

/* ====== TOAST ====== */
let toastTimer;
function showToast(msg) {
  toastEl.textContent = msg;
  toastEl.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => toastEl.classList.remove('show'), 2200);
}

/* ====== EVENTS ====== */
grid.addEventListener('click', (e) => {
  const fav = e.target.closest('[data-fav]');
  if (fav) {
    toggleFav(fav.dataset.fav, e);
    return;
  }
  const card = e.target.closest('.station');
  if (!card) return;
  const station = STATIONS.find(s => s.id === card.dataset.id);
  if (!station) return;
  if (state.current && state.current.id === station.id) {
    togglePlay();
  } else {
    playStation(station);
  }
});

searchInput.addEventListener('input', () => {
  state.query = searchInput.value.trim();
  renderGrid();
});

filtersEl.addEventListener('click', (e) => {
  const chip = e.target.closest('.chip');
  if (!chip) return;
  filtersEl.querySelectorAll('.chip').forEach(c => c.classList.remove('active'));
  chip.classList.add('active');
  state.category = chip.dataset.cat;
  state.favsOnly = chip.dataset.cat === 'favs';
  renderGrid();
});

playBtn.addEventListener('click', togglePlay);
$('#prevBtn').addEventListener('click', () => skip(-1));
$('#nextBtn').addEventListener('click', () => skip(1));
favNowBtn.addEventListener('click', () => {
  if (state.current) toggleFav(state.current.id);
});

volSlider.addEventListener('input', () => {
  state.volume = Number(volSlider.value);
  if (state.audio) state.audio.volume = state.volume;
});

$('#sleepBtn').addEventListener('click', (e) => {
  e.stopPropagation();
  sleepMenu.classList.toggle('open');
});
document.addEventListener('click', (e) => {
  if (!sleepMenu.contains(e.target) && e.target.id !== 'sleepBtn') {
    sleepMenu.classList.remove('open');
  }
});
sleepMenu.addEventListener('click', (e) => {
  const opt = e.target.closest('.sleep-opt');
  if (opt) setSleep(Number(opt.dataset.min));
});

// Keyboard shortcuts
document.addEventListener('keydown', (e) => {
  if (e.target.matches('input, textarea')) return;
  if (e.code === 'Space') {
    e.preventDefault();
    togglePlay();
  } else if (e.code === 'ArrowRight') {
    skip(1);
  } else if (e.code === 'ArrowLeft') {
    skip(-1);
  } else if (e.code === 'ArrowUp') {
    e.preventDefault();
    state.volume = Math.min(1, state.volume + 0.05);
    volSlider.value = state.volume;
    if (state.audio) state.audio.volume = state.volume;
  } else if (e.code === 'ArrowDown') {
    e.preventDefault();
    state.volume = Math.max(0, state.volume - 0.05);
    volSlider.value = state.volume;
    if (state.audio) state.audio.volume = state.volume;
  }
});

// Initial render
renderGrid();
</script>
</body>
</html>
